services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped
volumes:
  qdrant_data:
  app_data:
