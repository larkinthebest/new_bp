[project]
name = "touchline-rag"
version = "0.1.0"
description = "Segment-first multimodal sports analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "openai>=1.75,<3", "qdrant-client>=1.15,<2", "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "beautifulsoup4>=4.13,<5",
  "tiktoken>=0.9,<1", "httpx>=0.28,<1"
]

[project.optional-dependencies]
eval = ["ragas>=0.3,<0.4", "langchain-openai>=0.3,<0.4"]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
